<form hx-post="{% url 'book-create' %}"
      hx-target="#book-create-form"
      hx-swap="innerHTML"
      hx-disabled-elt="find button[type='submit']">
    {% csrf_token %}
    <div class="row g-2 align-items-start mb-3">
        <div class="col">
            <label for="{{ form.title.id_for_label }}" class="form-label">Title</label>
            {{ form.title }}
            {{ form.title.errors }}
        </div>
        <div class="col">
            <label for="{{ form.page_count.id_for_label }}" class="form-label">Page Count</label>
            {{ form.page_count }}
            {{ form.page_count.errors }}
        </div>
        <div class="col">
            <label for="{{ form.authors.id_for_label }}" class="form-label">Authors</label>
            {{ form.authors }}
            {{ form.authors.errors }}
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Add Book</button>
        </div>
    </div>
</form>
