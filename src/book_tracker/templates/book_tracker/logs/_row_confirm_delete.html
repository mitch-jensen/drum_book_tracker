<tr id="log-{{ log.id }}" class="table-warning">
    <td colspan="10">
        <div class="d-flex justify-content-between align-items-center gap-3">
            <span>
                Delete log for <strong>{{ log.exercise }}</strong>?
            </span>
            <div class="d-flex gap-2">
                <button type="button"
                        class="btn btn-sm btn-secondary"
                        hx-get="{% url 'log-row' log.id %}"
                        hx-target="#log-{{ log.id }}"
                        hx-swap="outerHTML">Cancel</button>
                <button type="button"
                        class="btn btn-sm btn-danger"
                        hx-delete="{% url 'log-delete' log.id %}"
                        hx-target="#log-table-body"
                        hx-swap="innerHTML">Confirm Delete</button>
            </div>
        </div>
    </td>
</tr>
