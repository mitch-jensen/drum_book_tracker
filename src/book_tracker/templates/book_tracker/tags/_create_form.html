<form hx-post="{% url 'tag-create' %}"
      hx-target="#tag-create-form"
      hx-swap="innerHTML"
      hx-disabled-elt="find button[type='submit']">
    {% csrf_token %}
    <div class="row g-2 align-items-start mb-3">
        <div class="col">
            {{ form.name }}
            {{ form.name.errors }}
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Add Tag</button>
        </div>
    </div>
</form>
