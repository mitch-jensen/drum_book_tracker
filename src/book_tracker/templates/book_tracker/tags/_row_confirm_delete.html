<tr id="tag-{{ tag.pk }}" class="table-warning">
    <td colspan="2">
        <div class="d-flex justify-content-between align-items-center gap-3">
            <span>
                Delete <strong>{{ tag.name }}</strong>?
            </span>
            <div class="d-flex gap-2">
                <button type="button"
                        class="btn btn-sm btn-secondary"
                        hx-get="{% url 'tag-row' tag.pk %}"
                        hx-target="#tag-{{ tag.pk }}"
                        hx-swap="outerHTML">Cancel</button>
                <button type="button"
                        class="btn btn-sm btn-danger"
                        hx-delete="{% url 'tag-delete' tag.pk %}"
                        hx-target="#tag-table-body"
                        hx-swap="innerHTML">Confirm Delete</button>
            </div>
        </div>
    </td>
</tr>
