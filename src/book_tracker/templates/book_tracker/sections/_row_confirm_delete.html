<div id="section-{{ section.id }}"
     class="list-group-item list-group-item-warning d-flex justify-content-between align-items-center gap-3">
    <input type="hidden" name="section" value="{{ section.id }}">
    <span>
        Delete <strong>{{ section.title }}</strong>?
    </span>
    <span class="d-flex gap-2">
        <button type="button"
                class="btn btn-sm btn-secondary"
                hx-get="{% url 'section-row' section.id %}"
                hx-target="#section-{{ section.id }}"
                hx-swap="outerHTML">Cancel</button>
        <button type="button"
                class="btn btn-sm btn-danger"
                hx-delete="{% url 'section-delete' section.id %}"
                hx-target="#section-table-body"
                hx-swap="innerHTML">Confirm Delete</button>
    </span>
</div>
