<div id="section-{{ section.id }}"
     class="list-group-item d-flex justify-content-between align-items-center gap-3"
     data-sortable-section>
    <input type="hidden" name="section" value="{{ section.id }}">
    <span class="section-drag-handle btn btn-sm btn-outline-secondary"
          role="button"
          aria-label="Drag section"
          title="Drag section">::</span>
    <span class="flex-grow-1">{{ section.title }}</span>
    <span class="text-muted small">pp. {{ section.start_page }}-{{ section.end_page }}</span>
    <span class="d-flex gap-2">
        <button type="button"
                class="btn btn-sm btn-outline-primary"
                hx-get="{% url 'section-edit' section.id %}"
                hx-target="#section-{{ section.id }}"
                hx-swap="outerHTML">Edit</button>
        <button type="button"
                class="btn btn-sm btn-outline-danger"
                hx-get="{% url 'section-confirm-delete' section.id %}"
                hx-target="#section-{{ section.id }}"
                hx-swap="outerHTML">Delete</button>
    </span>
</div>
