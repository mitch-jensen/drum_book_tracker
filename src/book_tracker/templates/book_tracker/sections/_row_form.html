<tr id="section-{{ section.id }}">
    <td colspan="4">
        <form hx-post="{% url 'section-update' section.id %}"
              hx-target="#section-table-body"
              hx-swap="innerHTML"
              hx-disabled-elt="find button[type='submit']">
            {% csrf_token %}
            <div class="row g-2 align-items-start">
                <div class="col">
                    {{ form.book }}
                    {{ form.book.errors }}
                </div>
                <div class="col">
                    {{ form.title }}
                    {{ form.title.errors }}
                </div>
                <div class="col">
                    {{ form.order }}
                    {{ form.order.errors }}
                </div>
                <div class="col-auto d-flex gap-2">
                    <button type="submit" class="btn btn-sm btn-primary">Save</button>
                    <button type="button"
                            class="btn btn-sm btn-secondary"
                            hx-get="{% url 'section-row' section.id %}"
                            hx-target="#section-{{ section.id }}"
                            hx-swap="outerHTML">Cancel</button>
                </div>
            </div>
        </form>
    </td>
</tr>
