<tr id="author-{{ author.pk }}" class="table-warning">
    <td colspan="3">
        <div class="d-flex justify-content-between align-items-center gap-3">
            <span>
                Delete <strong>{{ author.first_name }} {{ author.last_name }}</strong>?
            </span>
            <div class="d-flex gap-2">
                <button type="button"
                        class="btn btn-sm btn-secondary"
                        hx-get="{% url 'author-row' author.pk %}"
                        hx-target="#author-{{ author.pk }}"
                        hx-swap="outerHTML">Cancel</button>
                <button type="button"
                        class="btn btn-sm btn-danger"
                        hx-delete="{% url 'author-delete' author.pk %}"
                        hx-target="#author-table-body"
                        hx-swap="innerHTML">Confirm Delete</button>
            </div>
        </div>
    </td>
</tr>
